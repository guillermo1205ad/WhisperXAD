[project]
name = "nuestramemoria-dev"
version = "0.2.0"
description = "Pipeline híbrido de alta fidelidad para transcripción (OpenAI Whisper FP32), alineación forzada (WhisperX) y diarización (Pyannote 3.1)."
requires-python = ">=3.11,<3.12"

dependencies = [
    "openai-whisper>=20231117",
    "whisperx @ git+https://github.com/m-bain/whisperx.git",
    "pyannote.audio>=3.1,<4.0",
    "imageio-ffmpeg>=0.4.9",
    "pandas>=2.0.0",
    "python-dotenv>=1.2.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"